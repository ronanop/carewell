services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: carewell
      POSTGRES_PASSWORD: carewell
      POSTGRES_DB: carewell
    volumes:
      - carewell_pg_data:/var/lib/postgresql/data

volumes:
  carewell_pg_data:
